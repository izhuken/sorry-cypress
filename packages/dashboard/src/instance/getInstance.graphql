query getInstance($instanceId: ID!) {
  instance(id: $instanceId) {
    instanceId
    runId
    spec
    projectId
    run {
      runId
      meta {
        ciBuildId
      }
    }
    results {
      error
      stats {
        ...AllInstanceStats
      }
      tests {
        ...GetInstanceTest
        duration
      }
      screenshots {
        testId
        screenshotId
        height
        width
        screenshotURL
      }
      cypressConfig {
        video
        videoUploadOnPasses
      }
      videoUrl
    }
  }
}
