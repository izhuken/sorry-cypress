fragment RunDetailSpec on RunSpec {
  instanceId
  spec
  claimedAt
  completedAt
  machineId
  groupId
  results {
    error
    flaky
    stats {
      ...AllInstanceStats
    }
    reporterStats {
      suites
      tests
      passes
      pending
      failures
      start
      end
      duration
    }
  }
}
